version: '3.8'

services:
  bountyscope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bountyscope_engine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    command: ["monitor"]
